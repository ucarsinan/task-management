name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Build, test and static analysis
        run: ./mvnw -B -ntp verify dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - name: Runtime dependency advisories
        run: python3 scripts/audit-dependencies.py
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser, keyboard, links and accessibility
        run: npm run test:e2e
      - name: Restart, persistence and failure acceptance
        run: python3 scripts/acceptance.py
