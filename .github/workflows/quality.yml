name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Build, test and static analysis
        run: ./mvnw -B -ntp verify dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - name: Runtime dependency advisories
        run: python3 scripts/audit-dependencies.py
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser, keyboard, links and accessibility
        run: npm run test:e2e
      - name: Restart, persistence and failure acceptance
        run: python3 scripts/acceptance.py
