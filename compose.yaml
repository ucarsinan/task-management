name: task-management
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_management
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${TASK_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_management -d task_management"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
